# YDLIDAR X2 settings for ydlidar_ros2_driver. Install the driver and its SDK on the machine the
# lidar plugs into (the steps are in docs/WIRING.md). The scan is then filtered by scan_filter.
ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB1
    frame_id: lidar_link
    ignore_array: ""
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    sample_rate: 3
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: false
    inverted: true
    auto_reconnect: true
    isSingleChannel: true
    intensity: false
    support_motor_dtr: true
    angle_max: 180.0
    angle_min: -180.0
    range_max: 8.0
    range_min: 0.10
    frequency: 7.0
    invalid_range_is_inf: true
